name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || matrix.args == '--target x86_64-apple-darwin' && 'x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Todoer v__VERSION__
          releaseBody: |
            Download the installer for your platform below.

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `.dmg` with `aarch64` in the name |
            | macOS (Intel) | `.dmg` with `x86_64` in the name |
            | Windows | `.msi` or `.exe` |

            ### macOS: "damaged and can't be opened"

            Todoer is not signed with an Apple Developer certificate yet. After installing from the `.dmg`, macOS may block the app. The app is not actually damaged.

            **Option A — Right-click:** Right-click Todoer in Applications → **Open** → **Open** again.

            **Option B — Terminal:** Run this after dragging Todoer to Applications:

            ```bash
            xattr -cr /Applications/Todoer.app
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
